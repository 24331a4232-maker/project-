<rect x="116" y="378" width="18" height="18" rx="3" fill="#22C55E"/>
<rect x="158" y="378" width="18" height="18" rx="3" fill="#22C55E"/>
<!-- Door with arch -->
<path d="M 136,432 L 136,400 Q 147,390 158,400 L 158,432 Z" fill="#22C55E"/>
<!-- Door knob -->
<circle cx="155" cy="416" r="2.8" fill="white"/>

<!-- Fork + Knife icon (above building signage) -->
<!-- Fork handle -->
<rect x="138" y="328" width="5" height="26" rx="2.5" fill="#F97316"/>
<!-- Fork tines (3) -->
<rect x="136" y="314" width="2.5" height="16" rx="1.2" fill="#F97316"/>
<rect x="140.5" y="314" width="2.5" height="16" rx="1.2" fill="#F97316"/>
<rect x="145" y="314" width="2.5" height="16" rx="1.2" fill="#F97316"/>
<!-- Knife handle -->
<rect x="153" y="328" width="5" height="26" rx="2.5" fill="#F97316"/>
<!-- Knife blade -->
<path d="M 153,314 Q 158.5,317 158.5,328 L 153,328 Z" fill="#F97316"/>

<!-- Small label arc below fork/knife -->
<path d="M 130,356 Q 147,350 166,356" fill="none" stroke="#F97316" stroke-width="1.8" stroke-linecap="round"/>

