<!-- Box handle -->
<path d="M 551,382 Q 558,374 566,382" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>

<!-- Mother figure -->
<!-- Head -->
<circle cx="638" cy="365" r="15" fill="#22C55E"/>
<!-- Hair (simple top arc) -->
<path d="M 624,362 Q 638,350 652,362" fill="#15803D" stroke="none"/>
<!-- Dress/body (wider trapezoid) -->
<path d="M 625,381 Q 638,380 651,381 L 656,420 L 620,420 Z" fill="#22C55E"/>
<!-- Shoulder line -->
<path d="M 625,381 Q 638,376 651,381" fill="none" stroke="#15803D" stroke-width="1.8"/>
<!-- Left arm reaching toward volunteer/box -->
<rect x="605" y="386" width="22" height="8" rx="4" fill="#22C55E"/>
<!-- Right arm down -->
<rect x="651" y="389" width="8" height="20" rx="4" fill="#22C55E" transform="rotate(15 651 389)"/>

<!-- Child figure (smaller, next to mother) -->
<!-- Head -->
<circle cx="663" cy="400" r="11" fill="#22C55E"/>
<!-- Body -->
<path d="M 652,412 Q 663,411 674,412 L 677,436 L 649,436 Z" fill="#22C55E"/>
<!-- Arm raised (happy/reaching up gesture) -->
<rect x="647" y="407" width="7" height="18" rx="3.5" fill="#22C55E" transform="rotate(-32 647 407)"/>
<!-- Small smile arc on child (optional detail) -->

