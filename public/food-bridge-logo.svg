<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="4096" height="4096">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&amp;display=swap');
  </style>
</defs>

<!-- ═══════════════════════════════════════════ -->
<!-- OUTER DECORATIVE RINGS                     -->
<!-- ═══════════════════════════════════════════ -->
<circle cx="400" cy="435" r="340" fill="none" stroke="#F97316" stroke-width="4.5"/>
<circle cx="400" cy="435" r="324" fill="none" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="7 5"/>

<!-- Small orange accent dots on outer ring (cardinal positions) -->
<circle cx="400" cy="95" r="6" fill="#F97316"/>
<circle cx="400" cy="775" r="6" fill="#F97316"/>
<circle cx="60" cy="435" r="6" fill="#22C55E"/>
<circle cx="740" cy="435" r="6" fill="#22C55E"/>

<!-- ═══════════════════════════════════════════ -->
<!-- FOOD BOWL  (top center)                    -->
<!-- ═══════════════════════════════════════════ -->

<!-- Bowl body (light cream) -->
<path d="M 330,234 Q 328,274 350,284 Q 374,296 400,296 Q 426,296 450,284 Q 472,274 470,234 Z" fill="#FFFBF0"/>
<!-- Bowl left + right wall outlines -->
<path d="M 330,234 Q 328,274 350,284 Q 374,296 400,296 Q 426,296 450,284 Q 472,274 470,234" fill="none" stroke="#22C55E" stroke-width="3" stroke-linecap="round"/>
<!-- Bowl rim ellipse -->
<ellipse cx="400" cy="234" rx="70" ry="13" fill="white" stroke="#22C55E" stroke-width="3.2"/>

<!-- ── Food items inside bowl ── -->

<!-- Broccoli / green veg cluster -->
<circle cx="366" cy="255" r="11" fill="#22C55E"/>
<circle cx="379" cy="249" r="11" fill="#22C55E"/>
<circle cx="373" cy="261" r="8" fill="#22C55E"/>
<!-- Broccoli stem -->
<rect x="374" y="263" width="4" height="13" rx="2" fill="#15803D"/>

<!-- Tomato (red-orange) -->
<circle cx="408" cy="261" r="12" fill="#EF4444"/>
<circle cx="405" cy="257" r="4.5" fill="#FCA5A5" opacity="0.7"/>
<!-- Tomato stem + leaves -->
<rect x="407" y="247" width="3" height="7" rx="1.5" fill="#15803D"/>
<path d="M 406,250 Q 401,245 403,242 M 411,250 Q 415,245 413,242" fill="none" stroke="#15803D" stroke-width="1.6" stroke-linecap="round"/>

<!-- Bread roll -->
<ellipse cx="435" cy="254" rx="15" ry="11" fill="#D97706"/>
<path d="M 422,252 Q 435,243 448,252" fill="none" stroke="#92400E" stroke-width="1.8"/>

<!-- Carrot (triangle + leafy top) -->
<path d="M 388,268 L 393,283 L 383,283 Z" fill="#F97316"/>
<path d="M 388,268 Q 385,261 383,257 M 388,268 Q 388,260 390,257 M 388,268 Q 391,261 393,257" fill="none" stroke="#22C55E" stroke-width="1.6" stroke-linecap="round"/>

<!-- Spoon (handle + bowl) -->
<ellipse cx="452" cy="267" rx="7" ry="5.5" fill="none" stroke="#9CA3AF" stroke-width="2.5"/>
<path d="M 452,272.5 L 455,284 L 465,282" fill="none" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

<!-- ═══════════════════════════════════════════ -->
<!-- SUSTAINABILITY LEAF (top-right near bowl)  -->
<!-- ═══════════════════════════════════════════ -->
<path d="M 467,213 Q 453,197 460,179 Q 482,170 484,188 Q 487,206 467,213 Z" fill="#15803D"/>
<path d="M 467,213 Q 473,194 477,181" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<!-- Small stem below leaf -->
<path d="M 467,213 Q 463,220 465,226" fill="none" stroke="#15803D" stroke-width="2" stroke-linecap="round"/>

<!-- ═══════════════════════════════════════════ -->
<!-- BRIDGE  (arch suspension style, center)    -->
<!-- ═══════════════════════════════════════════ -->

<!-- Main arch — control point y=178 → actual apex ≈ y=302 -->
<path d="M 255,421 Q 400,178 545,421" fill="none" stroke="#15803D" stroke-width="7" stroke-linecap="round"/>

<!-- Suspension rods (arch top → bridge deck) -->
<!-- t=0.20: (299,357)  t=0.30: (343,322)  t=0.50: (400,300)  t=0.70: (457,322)  t=0.80: (501,357) -->
<line x1="299" y1="357" x2="299" y2="412" stroke="#22C55E" stroke-width="2.5"/>
<line x1="343" y1="322" x2="343" y2="412" stroke="#22C55E" stroke-width="2.5"/>
<line x1="400" y1="302" x2="400" y2="412" stroke="#22C55E" stroke-width="2.5"/>
<line x1="457" y1="322" x2="457" y2="412" stroke="#22C55E" stroke-width="2.5"/>
<line x1="501" y1="357" x2="501" y2="412" stroke="#22C55E" stroke-width="2.5"/>

<!-- Bridge road deck -->
<rect x="244" y="412" width="312" height="15" rx="5.5" fill="#15803D"/>

<!-- Railing posts (above deck) -->
<line x1="261" y1="412" x2="261" y2="396" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
<line x1="296" y1="412" x2="296" y2="396" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
<line x1="331" y1="412" x2="331" y2="396" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
<line x1="366" y1="412" x2="366" y2="396" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
<line x1="400" y1="412" x2="400" y2="396" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
<line x1="434" y1="412" x2="434" y2="396" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
<line x1="469" y1="412" x2="469" y2="396" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
<line x1="504" y1="412" x2="504" y2="396" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
<line x1="539" y1="412" x2="539" y2="396" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
<!-- Top handrail -->
<line x1="251" y1="396" x2="549" y2="396" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>

<!-- Bridge base pillars (below deck) -->
<rect x="260" y="427" width="12" height="42" rx="3" fill="#15803D"/>
<rect x="528" y="427" width="12" height="42" rx="3" fill="#15803D"/>
<!-- Pillar base footings -->
<rect x="254" y="466" width="24" height="8" rx="3" fill="#15803D"/>
<rect x="522" y="466" width="24" height="8" rx="3" fill="#15803D"/>

<!-- ═══════════════════════════════════════════ -->
<!-- LEFT OPEN HAND (giving / supporting)       -->
<!-- ═══════════════════════════════════════════ -->
<g fill="#F97316">
  <!-- 4 fingers (rounded rectangles pointing upward) -->
  <rect x="271" y="456" width="13" height="33" rx="6.5"/>
  <rect x="287" y="450" width="13" height="39" rx="6.5"/>
  <rect x="303" y="447" width="13" height="42" rx="6.5"/>
  <rect x="319" y="450" width="13" height="39" rx="6.5"/>
  <!-- Thumb (angled outward) -->
  <ellipse cx="259" cy="476" rx="10" ry="17" transform="rotate(-22 259 476)"/>
  <!-- Palm base -->
  <rect x="263" y="484" width="78" height="33" rx="13"/>
</g>

<!-- ═══════════════════════════════════════════ -->
<!-- RIGHT OPEN HAND (receiving / supporting)   -->
<!-- ═══════════════════════════════════════════ -->
<g fill="#F97316">
  <!-- 4 fingers (mirrored) -->
  <rect x="516" y="456" width="13" height="33" rx="6.5"/>
  <rect x="500" y="450" width="13" height="39" rx="6.5"/>
  <rect x="484" y="447" width="13" height="42" rx="6.5"/>
  <rect x="468" y="450" width="13" height="39" rx="6.5"/>
  <!-- Thumb (angled outward, mirrored) -->
  <ellipse cx="541" cy="476" rx="10" ry="17" transform="rotate(22 541 476)"/>
  <!-- Palm base -->
  <rect x="459" y="484" width="78" height="33" rx="13"/>
</g>

<!-- ═══════════════════════════════════════════ -->
<!-- RESTAURANT / HOTEL ICON (left side)        -->
<!-- ═══════════════════════════════════════════ -->

<!-- Building body -->
<rect x="104" y="370" width="84" height="62" rx="4" fill="white" stroke="#22C55E" stroke-width="3.2"/>
